[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-os"
version = "1.0.0rc1"
description = "MATLAB Expert Agent - Senior-Level MATLAB and Simulink Engineering Agent"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
engine = ["matlabengine==24.2.*"]
dev = ["pytest>=7.0"]

[project.scripts]
matlab-os-agent = "matlab_os.main:main"
v1-cli = "matlab_os.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["matlab_os*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
